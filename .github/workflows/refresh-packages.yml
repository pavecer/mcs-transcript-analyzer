name: refresh release packages

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild packages even when deployable inputs have not changed
        required: false
        type: boolean
        default: false
      export_only:
        description: Export live solutions without deploying the committed code app
        required: false
        type: boolean
        default: false
      artifact:
        description: Solution artifact to refresh
        required: false
        type: choice
        default: all
        options:
          - all
          - core
          - credits
          - codeApp

permissions:
  contents: read
  id-token: write

concurrency:
  group: refresh-release-packages
  cancel-in-progress: false

env:
  ALLOWED_PROGRAMMATIC_TENANT_ID: 1938ee32-a258-454c-b8db-3a928341bd69
  CORE_SOLUTION: pvConversationInsights
  CREDITS_SOLUTION: pvConversationInsightsCredits
  CODEAPP_SOLUTION: pvConversationInsightsCodeApp
  POWER_PLATFORM_CLIENT_ID: ${{ vars.POWER_PLATFORM_CLIENT_ID }}
  POWER_PLATFORM_TENANT_ID: ${{ vars.POWER_PLATFORM_TENANT_ID }}
  POWER_PLATFORM_ENVIRONMENT_ID: ${{ vars.POWER_PLATFORM_ENVIRONMENT_ID }}
  POWER_PLATFORM_ENVIRONMENT_URL: ${{ vars.POWER_PLATFORM_ENVIRONMENT_URL }}

jobs:
  refresh:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        artifact: [core, credits, codeApp]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect committed package changes
        id: changes
        shell: bash
        run: |
          requested="${{ inputs.artifact || 'all' }}"
          artifact="${{ matrix.artifact }}"
          if [[ "$requested" != "all" && "$requested" != "$artifact" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Skipping $artifact because $requested was requested."
            exit 0
          fi
          case "$artifact" in
            core) paths=(plugin pcf solution/pvConversationInsights scripts/transcript_insights ':(exclude,glob)**/*.md') ;;
            credits) paths=(solution/pvConversationInsightsCredits ':(glob)scripts/transcript_insights/*credit*.py') ;;
            codeApp) paths=(codeapp ':(exclude,glob)**/*.md') ;;
            *) echo "::error::Unsupported artifact scope: $artifact"; exit 1 ;;
          esac
          source_sha=$(git log -1 --format=%H -- "${paths[@]}")
          packaged_sha=$(ARTIFACT="$artifact" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("site/downloads/release-manifest.json")
          if not path.exists():
              print("")
          else:
              manifest = json.loads(path.read_text())
              artifact = os.environ["ARTIFACT"]
              published = manifest.get("artifacts", {}).get(artifact, {})
              print(published.get("sourceCommit", manifest.get("sourceCommit", "")))
          PY
          )
          force="${{ inputs.force || 'false' }}"
          if [[ "$force" != "true" && "$source_sha" == "$packaged_sha" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No committed package inputs changed since $packaged_sha."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
            echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
            echo "Refreshing $artifact packages for $source_sha (previously $packaged_sha)."
          fi

      - name: Require OIDC configuration
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          missing=0
          for name in \
            POWER_PLATFORM_CLIENT_ID \
            POWER_PLATFORM_TENANT_ID \
            POWER_PLATFORM_ENVIRONMENT_ID \
            POWER_PLATFORM_ENVIRONMENT_URL; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Repository variable $name is not configured."
              missing=1
            fi
          done
          if [[ "$POWER_PLATFORM_TENANT_ID" != "$ALLOWED_PROGRAMMATIC_TENANT_ID" ]]; then
            echo "::error::Programmatic writes are allowed only in tenant $ALLOWED_PROGRAMMATIC_TENANT_ID."
            missing=1
          fi
          exit "$missing"

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.changed == 'true' && steps.changes.outputs.artifact == 'codeApp'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: codeapp/package-lock.json

      - uses: actions/setup-dotnet@v4
        if: steps.changes.outputs.changed == 'true'
        with:
          dotnet-version: "10.0.x"

      - name: Install Power Platform CLI
        if: steps.changes.outputs.changed == 'true'
        run: dotnet tool install --global Microsoft.PowerApps.CLI.Tool

      - name: Build committed code app
        if: steps.changes.outputs.changed == 'true' && steps.changes.outputs.artifact == 'codeApp'
        working-directory: codeapp
        run: |
          npm ci
          npm test
          npm run build

      - name: Configure code app target
        if: steps.changes.outputs.changed == 'true' && steps.changes.outputs.artifact == 'codeApp'
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          release = json.loads(Path("config/release-packages.json").read_text())
          config = json.loads(Path("codeapp/power.config.sample.json").read_text())
          config["appId"] = release["codeApp"]["appId"]
          config["environmentId"] = os.environ["POWER_PLATFORM_ENVIRONMENT_ID"]
          Path("codeapp/power.config.json").write_text(json.dumps(config, indent=2) + "\n")
          PY

      - name: Authenticate to Power Platform with GitHub OIDC
        if: steps.changes.outputs.changed == 'true'
        run: |
          pac auth create \
            --name github-oidc \
            --applicationId "$POWER_PLATFORM_CLIENT_ID" \
            --tenant "$POWER_PLATFORM_TENANT_ID" \
            --githubFederated \
            --environment "$POWER_PLATFORM_ENVIRONMENT_URL"
          pac org who

      - name: Deploy committed code app
        if: steps.changes.outputs.changed == 'true' && inputs.export_only != true && steps.changes.outputs.artifact == 'codeApp'
        working-directory: codeapp
        run: >-
          pac code push
          --environment "$POWER_PLATFORM_ENVIRONMENT_URL"
          --solutionName "$CODEAPP_SOLUTION"

      - name: Export managed release packages
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          mkdir -p output/candidate
          core_file=$(python3 -c 'import json; print(json.load(open("config/release-packages.json"))["core"]["filename"])')
          credits_file=$(python3 -c 'import json; print(json.load(open("config/release-packages.json"))["credits"]["filename"])')
          codeapp_file=$(python3 -c 'import json; print(json.load(open("config/release-packages.json"))["codeApp"]["filename"])')
          artifact="${{ steps.changes.outputs.artifact }}"
          if [[ "$artifact" == "core" ]]; then
            pac solution export --environment "$POWER_PLATFORM_ENVIRONMENT_URL" --name "$CORE_SOLUTION" --path "output/candidate/$core_file" --managed --overwrite
          fi
          if [[ "$artifact" == "credits" ]]; then
            pac solution export --environment "$POWER_PLATFORM_ENVIRONMENT_URL" --name "$CREDITS_SOLUTION" --path "output/candidate/$credits_file" --managed --overwrite
          fi
          if [[ "$artifact" == "codeApp" ]]; then
            pac solution export --environment "$POWER_PLATFORM_ENVIRONMENT_URL" --name "$CODEAPP_SOLUTION" --path "output/candidate/$codeapp_file" --managed --overwrite
          fi

      - name: Validate candidate packages
        if: steps.changes.outputs.changed == 'true'
        run: |
          python3 scripts/validate_candidate_packages.py \
            --artifact "${{ steps.changes.outputs.artifact }}" \
            --source-commit "${{ steps.changes.outputs.source_sha }}"

      - name: Upload candidate set
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: managed-candidate-${{ steps.changes.outputs.artifact }}-${{ steps.changes.outputs.source_sha }}
          path: output/candidate/
          if-no-files-found: error
          retention-days: 30