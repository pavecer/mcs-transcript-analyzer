name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: pip install -r scripts/transcript_insights/requirements.txt
      - name: Compile
        run: python -m compileall -q scripts
      - name: Validate release and clean-install automation
        run: python -m unittest scripts.test_generate_linkedin_post scripts.test_publish_linkedin_post scripts.test_component_release scripts.test_validate_clean_install
      - name: Validate transcript and solution contracts
        run: python -m unittest discover -s scripts/transcript_insights -p "test_*.py" -v
      - name: Validate Python and C# transcript analysis parity
        run: python scripts/validate_parser_parity.py
      - name: Validate solution ownership and tenant boundaries
        run: python scripts/validate_solution_ownership.py
      - name: Validate release evidence
        run: python scripts/validate_release_evidence.py
      - name: Validate npm lockfile registries
        run: python scripts/validate_npm_lockfiles.py
      - name: Enforce shared VS Code browser policy
        run: python3 scripts/validate_browser_policy.py

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      # net462 builds on Linux via Microsoft.NETFramework.ReferenceAssemblies.
      - name: Build (warnings are errors)
        run: dotnet build plugin/plugin.csproj -c Release -warnaserror

  pcf:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pcf/JsonViewer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: pcf/JsonViewer/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  codeapp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codeapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: codeapp/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate release documentation coverage
        run: python3 scripts/validate_documentation.py
      - name: Validate Pages site and install package
        run: python3 scripts/validate_site.py

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject committed secrets, captures and env config
        run: |
          set -e
          fail=0
          if git ls-files | grep -E '\.har$|^evidence/'; then
            echo "::error::HAR captures must not be committed (they contain user identifiers)"; fail=1
          fi
          if git ls-files | grep -E 'config/transcript_solution_config\.(dev|sandbox)\.json$'; then
            echo "::error::Environment-specific config must not be committed"; fail=1
          fi
          if git ls-files | grep -E '(^|/)\.env$|msal_token_cache'; then
            echo "::error::Credential files must not be committed"; fail=1
          fi
          exit $fail
